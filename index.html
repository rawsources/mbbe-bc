function counts() {

async function compressImage(file, max, q, png) {
  const img = await loadImage(file);
  const scale = Math.min(1, max / Math.max(img.width, img.height));
  const c = document.createElement('canvas'); c.width = Math.round(img.width * scale); c.height = Math.round(img.height * scale);
  const x = c.getContext('2d');
  if (!png) { x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height); }

/* ---------- Colours from logo ---------- */
function rgbToHsl(r, g, b) {
  r /= 255; g /= 255; b /= 255;
  const mx = Math.max(r, g, b), mn = Math.min(r, g, b); let h = 0, s = 0; const l = (mx + mn) / 2;
  if (mx !== mn) { const d = mx - mn; s = l > .5 ? d / (2 - mx - mn) : d / (mx + mn);
    h = mx === r ? (g - b) / d + (g < b ? 6 : 0) : mx === g ? (b - r) / d + 2 : (r - g) / d + 4; h *= 60; }
  return [h, s, l];
}
function hslToHex(h, s, l) {
  const k = n => (n + h / 30) % 12, a = s * Math.min(l, 1 - l);
  const f = n => Math.round(255 * (l - a * Math.max(-1, Math.min(k(n) - 3, Math.min(9 - k(n), 1))))).toString(16).padStart(2, '0');
  return '#' + f(0) + f(8) + f(4);
}
async function paletteFromImage(src) {
  const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = src; });
  const c = document.createElement('canvas'), s = 72; c.width = s; c.height = s;
  const x = c.getContext('2d'); x.drawImage(img, 0, 0, s, s);
  const d = x.getImageData(0, 0, s, s).data, buckets = {};
  for (let i = 0; i < d.length; i += 4) {
    if (d[i + 3] < 200) continue;
    const [h, sa, l] = rgbToHsl(d[i], d[i + 1], d[i + 2]);
    if (sa < .22 || l < .08 || l > .93) continue;
    const k = Math.round(h / 12) + '-' + Math.round(l * 5);
    const b = buckets[k] || (buckets[k] = { n: 0, h: 0, s: 0, l: 0 });
    b.n++; b.h += h; b.s += sa; b.l += l;
  }
  const list = Object.values(buckets).map(b => ({ n: b.n, h: b.h / b.n, s: b.s / b.n, l: b.l / b.n })).sort((a, b) => b.n - a.n);
  if (!list.length) return null;
  const p = list[0];
  const primary = hslToHex(p.h, Math.min(p.s, .75), Math.min(p.l, .32));
  const hueDist = (a, b) => { const d = Math.abs(a - b) % 360; return d > 180 ? 360 - d : d; };
  const a = list.find(c => hueDist(c.h, p.h) > 35 && c.n > list[0].n * .04) || list.find(c => Math.abs(c.l - p.l) > .25);
  const accent = a ? hslToHex(a.h, Math.min(Math.max(a.s, .5), .9), Math.max(Math.min(a.l, .6), .45)) : hslToHex((p.h + 40) % 360, .7, .52);
  return { primary, accent };
}

      <input class="pin-input" type="password" inputmode="numeric" autocomplete="current-password" id="pin" aria-label="PIN" required>
      <p class="err" id="loginerr">${esc(msg || '')}</p>
      <button class="btn primary" style="width:100%" type="submit">Sign in</button>

}
function absorb(r) {

  D = { settings: r.settings, clubs: r.clubs, members: r.members, visitors: r.visitors, sessions: r.sessions, schedule: r.schedule || [] };
  if (r.today) TODAY = r.today;
  if (!UI.date) UI.date = r.today || localToday();
  if (UI.clubId && !getClub(UI.clubId)) { UI.view = 'clubs'; UI.clubId = null; }
}

}

let refreshing = false;
async function refresh(manual) {
  if (!PIN || refreshing || pending) return;
  refreshing = true;
  try {
    const r = await api('getAppData', PIN);
    if (pending) return;
    absorb(r);
    if (manual) { await loadPublic(); render(); toast('Up to date'); }
    else if (!$('#modal').open) {
      applyTheme(); renderTop();
      if (UI.view === 'club' && UI.tab === 'attendance' && $('#mlist')) refreshAttendance();
      else if (UI.view === 'clubs' && !document.activeElement.closest('main')) render();
    }
  } catch (e) { if (manual) fail(e); if (/PIN/.test(e.message)) signOut(); }
  finally { refreshing = false; }
}
setInterval(() => { if (document.visibilityState === 'visible') refresh(false); }, 30000);

/* ---------- Meeting schedule ---------- */
function today() { return TODAY || localToday(); }
function addDaysIso(iso, n) { const d = new Date(iso + 'T12:00:00Z'); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); }
function bySched(a, b) { return (a.date + (a.time || '99')).localeCompare(b.date + (b.time || '99')); }
function clubSchedule(cid) { return ((D && D.schedule) || []).filter(x => x.clubId === cid && x.date >= today()).sort(bySched); }
function nextMeeting(cid) {
  if (D && getClub(cid)) return clubSchedule(cid)[0] || null;
  const p = PUB && PUB.clubs.find(x => x.id === cid);
  return (p && p.next && p.next.date >= today()) ? p.next : null;
}
function meetsToday(cid, nx) {
  if (nx && nx.date === today()) return true;
  if (D && getClub(cid)) return clubSessions(cid).some(s => s.date === today() && (s.members.length + s.visitors.length));
  const p = PUB && PUB.clubs.find(x => x.id === cid);
  return !!(p && p.active);
}
function fmtTime(t) {
  const m = String(t || '').match(/^(\d{1,2}):(\d{2})/); if (!m) return '';
  const h = +m[1]; return (h % 12 || 12) + ':' + m[2] + ' ' + (h < 12 ? 'AM' : 'PM');
}
function fmtDay(iso) {
  if (iso === today()) return 'Today';
  if (iso === addDaysIso(today(), 1)) return 'Tomorrow';
  const d = new Date(iso + 'T00:00:00');
  return isNaN(d) ? iso : d.toLocaleDateString('en-PH', { weekday: 'short', month: 'short', day: 'numeric' });
}
function fmtWhen(m) { return [fmtDay(m.date), fmtTime(m.time)].filter(Boolean).join(' · '); }
function mapHref(m) { return m.mapUrl || ('https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(m.venue)); }
function whenBlock(m) {
  if (!m) return `<div class="club-when none">${ICM.cal}<span>No upcoming schedule yet</span></div>`;
  return `<div class="club-when"><div class="cw-row${m.date === today() ? ' is-today' : ''}">${ICM.cal}<b>${esc(fmtWhen(m))}</b></div>
    ${m.venue ? `<a class="cw-row cw-venue" href="${esc(mapHref(m))}" target="_blank" rel="noopener" title="Open in Google Maps">${ICM.pin}<span>${esc(m.venue)}</span></a>` : ''}</div>`;
}
function scheduleModal(item) {
  const c = club(), later = item ? clubSchedule(c.id).filter(x => bySched(x, item) > 0) : [];
  const last = clubSchedule(c.id).slice(-1)[0];
  const lastSes = clubSessions(c.id)[0];
  let date = item ? item.date : last ? addDaysIso(last.date, 7) : lastSes ? addDaysIso(lastSes.date, 7) : today();
  if (!item) while (date < today()) date = addDaysIso(date, 7);
  const venues = [...new Set([...((D.schedule || []).filter(x => x.clubId === c.id).map(x => x.venue)), c.location].filter(Boolean))];
  openModal({
    title: item ? 'Edit schedule' : 'Add to the schedule',
    body: `${fld('date', 'Date', date, 'date', `required min="${today()}"`)}
      ${fld('time', 'Time', item ? item.time : (last ? last.time : ''), 'time', 'step="900"')}
      <div class="field full"><label for="f-venue">Venue</label><input type="text" id="f-venue" name="venue" value="${esc(item ? item.venue : (last ? last.venue : c.location || ''))}" list="venue-list" required placeholder="e.g. Function room, 5F Tower One">
        <datalist id="venue-list">${venues.map(v => `<option value="${esc(v)}">`).join('')}</datalist></div>
      ${fld('mapUrl', 'Google Maps link (optional)', item ? item.mapUrl : (last ? last.mapUrl : ''), 'url', 'placeholder="https://maps.app.goo.gl/…"', 'full')}
      <p class="hint full" style="margin:-6px 0 0">Without a link, the card opens a map search for the venue name.</p>
      ${fld('topic', 'Lesson or topic (optional)', item ? item.topic : '', 'text', 'placeholder="e.g. The Parable of the Sower"', 'full')}
      ${item ? (later.length ? `<label class="consent-c full"><input type="checkbox" name="later" value="1"><span>Use this venue for the ${later.length} later meeting${later.length === 1 ? '' : 's'} too</span></label>` : '')
        : sel('repeat', 'Repeat', '0', [['0', 'Just this date'], ['3', 'Every week for 4 weeks'], ['7', 'Every week for 8 weeks'], ['11', 'Every week for 12 weeks']], 'full', false)}`,
    submit: item ? 'Save changes' : 'Add to schedule',
    onSubmit: async fd => {
      const saved = await api('saveSchedule', PIN, { id: item ? item.id : '', clubId: c.id, date: fd.date, time: fd.time, venue: fd.venue, mapUrl: fd.mapUrl, topic: fd.topic }, +fd.repeat || 0, !!fd.later);
      saved.forEach(x => { const i = D.schedule.findIndex(y => y.id === x.id); if (i > -1) D.schedule[i] = x; else D.schedule.push(x); });
      render(); toast(item ? 'Schedule updated' : (saved.length > 1 ? saved.length + ' meetings added' : 'Added to the schedule'));
      loadPublic().catch(() => {});
    },
    danger: item ? { label: 'Delete', fn: () => removeSchedule(item) } : null
  });
}
async function removeSchedule(item) {
  if (!confirm('Remove the ' + fmtWhen(item) + ' meeting from the schedule?')) return;
  await api('deleteSchedule', PIN, item.id);
  D.schedule = D.schedule.filter(x => x.id !== item.id);
  closeModal(); render(); toast('Removed from the schedule');
  loadPublic().catch(() => {});
}

      <div class="sched-t"><b>${esc(fmtWhen(x))}</b><a href="${esc(mapHref(x))}" target="_blank" rel="noopener">${ICM.pin}${esc(x.venue)}</a>${x.topic ? `<small>${esc(x.topic)}</small>` : ''}</div>

async function toggle(type, id) {
  const s = localSession(true);
  const key = type === 'Member' ? 'members' : 'visitors';
  const present = !s[key].includes(id);
  s[key] = present ? [...s[key], id] : s[key].filter(x => x !== id);
  const date = UI.date, clubId = UI.clubId;
  pruneLocal(s); refreshAttendance();
  pending++;
  try {
    const r = await api('setAttendance', PIN, clubId, date, type, id, present);
    const ls = D.sessions.find(x => x.clubId === clubId && x.date === date);
    if (ls && r.sessionId) ls.id = r.sessionId;
  } catch (e) {
    const ls = D.sessions.find(x => x.clubId === clubId && x.date === date) || (() => { const n = { id: '', clubId, date, topic: '', members: [], visitors: [] }; D.sessions.push(n); return n; })();
    ls[key] = present ? ls[key].filter(x => x !== id) : [...ls[key], id];
    pruneLocal(ls); refreshAttendance(); fail(e);
  } finally { pending--; }
}

function openModal({ title, body, submit = 'Save', onSubmit, danger, wide }) {
  const dlg = $('#modal');
  dlg.className = wide ? 'wide' : '';
  dlg.onclose = null;
  dlg.innerHTML = `<form id="mform"><header><h2>${esc(title)}</h2><button type="button" class="icon-btn" data-act="close-modal" aria-label="Close">✕</button></header>

  const f = $('#mform');
  f.onsubmit = async e => {
    e.preventDefault(); if (!onSubmit) return closeModal();
    const fd = Object.fromEntries(new FormData(f));
    for (const k in fd) if (typeof fd[k] === 'string') fd[k] = fd[k].trim();
    f.classList.add('busy'); const btn = $('#msubmit'); const label = btn.textContent; btn.textContent = 'Saving…';
    try { const r = await onSubmit(fd, f); if (r !== false) closeModal(); }

  if (danger) $('#mdanger').onclick = async () => { f.classList.add('busy'); try { await danger.fn(); } catch (err) { fail(err); } finally { f.classList.remove('busy'); } };

}

/* ---------- Bulk upload of club covers and logos ---------- */
function guessClub(fileName) {
  const key = fileName.toLowerCase().replace(/\.[a-z0-9]+$/, '').replace(/mbbe|bible|club|cover|logo|\bbc\b/g, ' ').replace(/[^a-z0-9]+/g, ' ').trim().replace(/\s+/g, ' ');
  if (!key) return '';
  const compact = key.replace(/ /g, '');
  for (const c of D.clubs) {
    const name = c.name.toLowerCase().replace(/\bbc\b|bible club/g, ' ').replace(/[^a-z0-9]+/g, ' ').trim();
    const initials = name.split(' ').filter(Boolean).map(w => w[0]).join('');
    const loc = (c.location || '').toLowerCase();
    if (name.replace(/ /g, '') === compact || initials === compact || name.includes(key) || (loc && loc.replace(/[^a-z0-9]/g, '') === compact)) return c.id;
  }
  return '';
}
async function bulkImagesModal(files) {
  const rows = files.map(f => ({ file: f, kind: /cover/i.test(f.name) ? 'cover' : 'logo', clubId: guessClub(f.name), preview: '' }));

        <td><select data-k="${i}" class="bkind"><option value="cover" ${r.kind === 'cover' ? 'selected' : ''}>Cover photo</option><option value="logo" ${r.kind === 'logo' ? 'selected' : ''}>Logo</option></select></td>
        <td><select data-c="${i}" class="bclub">${opts(r.clubId)}</select></td></tr>`).join('')}

    submit: 'Save all',

/* ---------- QR code ---------- */
function checkinUrl(c) { return pageUrl('page=checkin&club=' + c.id); }
/**
 * MBBE-styled QR code: navy squares, rounded corner eyes with orange centres, and a logo in the middle.
 * High error correction keeps it scannable with the logo covering the centre.
 */
function qrSvg(url, cell, logo) {
  try {
    const q = qrcode(0, 'H'); q.addData(url); q.make();
    const n = q.getModuleCount(), Q = 2, S = n + Q * 2, c = S / 2, lr = n * 0.115, clear = lr + 0.9;
    const NAVY = '#2B3246', ORANGE = '#CF5838';
    const eye = (r, k) => (r < 7 && k < 7) || (r < 7 && k >= n - 7) || (r >= n - 7 && k < 7);
    let d = '';
    for (let r = 0; r < n; r++) for (let k = 0; k < n; k++) {
      if (!q.isDark(r, k) || eye(r, k)) continue;
      const x = k + Q, y = r + Q;
      if (Math.hypot(x + .5 - c, y + .5 - c) < clear) continue;
      d += 'M' + x + ' ' + y + 'h1v1h-1z';
    }
    const finder = (x, y) => `\x3crect x="${x + .5}" y="${y + .5}" width="6" height="6" rx="1.7" fill="none" stroke="${NAVY}" stroke-width="1"/>\x3crect x="${x + 2}" y="${y + 2}" width="3" height="3" rx=".75" fill="${ORANGE}"/>`;
    const px = S * (cell || 6), img = logo || logoSrc();
    return `\x3csvg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${S} ${S}" width="${px}" height="${px}" role="img" aria-label="QR code">
      \x3crect width="${S}" height="${S}" fill="#fff"/>\x3cpath d="${d}" fill="${NAVY}" shape-rendering="crispEdges"/>
      ${finder(Q, Q)}${finder(Q + n - 7, Q)}${finder(Q, Q + n - 7)}
      \x3ccircle cx="${c}" cy="${c}" r="${lr + .45}" fill="#fff"/>
      \x3cimage x="${c - lr}" y="${c - lr}" width="${lr * 2}" height="${lr * 2}" href="${img}" preserveAspectRatio="xMidYMid meet"/>\x3c/svg>`;
  } catch (e) { return ''; }
}
/** Saves a QR code as a 1200 × 1200 PNG image. */
function downloadQr(svg, name) {
  const img = new Image();
  img.onload = () => {
    const cv = document.createElement('canvas'); cv.width = cv.height = 1200;
    const g = cv.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, 1200, 1200); g.drawImage(img, 0, 0, 1200, 1200);
    try { downloadDataUrl(name, cv.toDataURL('image/png')); } catch (e) { toast('The QR image could not be saved.', true); }
  };
  img.onerror = () => toast('The QR image could not be saved.', true);
  img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg.replace(/width="\d+(\.\d+)?" height="\d+(\.\d+)?"/, 'width="1200" height="1200"'));
}
/** The QR library loads only when a QR code is needed, so it can never hold up the app starting. */
let qrLib = null;
function loadQrLib() {
  if (window.qrcode) return Promise.resolve();
  return qrLib || (qrLib = new Promise((res, rej) => {
    const sc = document.createElement('script');
    sc.src = 'https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js';
    sc.onload = res; sc.onerror = () => { qrLib = null; rej(new Error('The QR code tool could not load. Check your connection and try again.')); };
    document.head.appendChild(sc);
  }));
}
async function qrModal(c, register) {
  if (!APP_URL) return toast('The QR links are available once the web app is deployed.', true);
  try { await loadQrLib(); } catch (e) { return toast(e.message, true); }
  const clubLogo = (c.logoId && IMG[c.logoId]) || '';
  const url = register ? pageUrl('page=register&club=' + c.id) : checkinUrl(c), svg = qrSvg(url, 6, clubLogo);
  const label = register ? 'Sign-up' : 'Check-in';
  openModal({
    title: label + ' QR for ' + c.name, wide: true,
    body: `<div class="full qr">${svg || '<p class="muted">The QR code could not be drawn. Use the link below.</p>'}</div>
      <div class="field full"><label for="qrlink">${label} link</label><input type="text" id="qrlink" readonly value="${esc(url)}"></div>
      <p class="note">${register
        ? 'People scan this to register their own details, as a member or a visitor. It doesn\'t check them in. New members wait in the Members tab under "Waiting for approval" until a coordinator approves them. Visitors go straight to the Visitors tab. The form cannot show anyone else\'s records.'
        : 'Print this and place it at the entrance, or open the link on the tablet you\'ll pass around. People can only check in or register as a visitor there. They can\'t see anyone else\'s records.'}</p>
      <div class="full inline"><button type="button" class="btn sm" id="qrcopy">Copy link</button><a class="btn sm" href="${esc(url)}" target="_blank" rel="noopener">Open ${register ? 'sign-up' : 'check-in'} page</a><button type="button" class="btn sm" id="qrsave">Download QR image</button><button type="button" class="btn sm primary" id="qrprint">Print QR poster</button></div>`
  });
  $('#qrsave').onclick = () => downloadQr(svg, slug(c.name) + '-' + (register ? 'sign-up' : 'check-in') + '-qr.png');
  $('#qrlink').onclick = e => e.target.select();
  $('#qrcopy').onclick = async () => { try { await navigator.clipboard.writeText(url); toast('Link copied'); } catch (e) { $('#qrlink').select(); toast('Press Ctrl+C to copy the selected link.'); } };
  $('#qrprint').onclick = () => {
    const logo = (c.logoId && IMG[c.logoId]) || logoSrc();
    $('#print-area').innerHTML = `<div class="qr-poster">${logo ? `<img src="${logo}" alt="" style="width:${c.logoId && IMG[c.logoId] ? 150 : 80}px;height:${c.logoId && IMG[c.logoId] ? 150 : 80}px;object-fit:contain">` : ''}
      <h1>${esc(c.name)}</h1>${register
        ? `<p>Join this Bible Club</p>${qrSvg(url, 10, clubLogo)}<p>Scan to register as a member or visitor of ${esc(c.name)}.</p>`
        : `<p>Scan to check in to today's Bible Club.</p>${qrSvg(url, 10, clubLogo)}<p>First time here? Scan and register as a visitor.</p>`}</div>`;
    window.print();
  };
}

    submit: 'Save settings',
    onSubmit: async fd => {
      if (logoChanged && logo) { const id = await api('uploadImage', PIN, 'logo', '', logo); IMG[id] = logo; D.settings.logoId = id; }
      const r = await api('saveSettings', PIN, { ministryName: s.ministryName, churchName: s.churchName, primary: fd.primary, accent: fd.accent, logoId: logoRemoved && !logoChanged ? '' : undefined, publicUrl: fd.publicUrl || '' });
      D.settings = r; render(); toast('Settings saved');

  const preview = (p, a) => { $('#cp').value = p; $('#ca').value = a; document.documentElement.style.setProperty('--primary', p); document.documentElement.style.setProperty('--accent', a); };
  $('#cp').oninput = e => document.documentElement.style.setProperty('--primary', e.target.value);
  $('#ca').oninput = e => document.documentElement.style.setProperty('--accent', e.target.value);
  $('#modal').onclose = () => applyTheme();
  const fromLogo = async () => { try { const pal = await paletteFromImage(logo); if (pal) preview(pal.primary, pal.accent); else toast('No strong colours found in the logo. Pick them manually.'); } catch (e) {} };
  $('#lup').onclick = () => pickFile('#filepick', async f => {
    try { logo = await compressImage(f, 360, 1, true); logoChanged = true; $('#lprev').innerHTML = `<img src="${logo}" alt="">`; $('#lrm').hidden = false; $('#cauto').hidden = false; $('#lup').textContent = 'Change logo'; await fromLogo(); }
    catch (e) { toast('That file could not be read as an image.', true); }
  });
  $('#lrm').onclick = () => { logo = ''; logoChanged = false; logoRemoved = true; $('#lprev').innerHTML = IC.book.replace('<svg', '<svg width="30" height="30" style="color:var(--muted)"'); $('#lrm').hidden = true; $('#cauto').hidden = true; };
  $('#cauto').onclick = fromLogo;
  $('#appqr').onclick = async () => {
    const u = siteUrl(); if (!u) return toast('Deploy the web app first.', true);
    try { await loadQrLib(); } catch (e) { return toast(e.message, true); }
    downloadQr(qrSvg(u, 6), 'bc-attendance-qr.png');
  };
  $('#ghpage').onclick = () => { if (!APP_URL) return toast('Deploy the web app first.', true); download('index.html', githubPage(), 'text/html'); };
  $('#bulkimg').onclick = () => { const inp = $('#multipick'); inp.value = ''; inp.onchange = () => inp.files.length && bulkImagesModal([...inp.files]); inp.click(); };
  $('#importbtn').onclick = () => pickFile('#jsonpick', async f => {
    let data;
    try { data = JSON.parse(await f.text()); if (!data.clubs) throw new Error(); } catch (e) { return toast('That is not a Bible Club data file.', true); }
    if (!confirm('Import the records from ' + f.name + ' into the Google Sheet? Records that already exist are skipped.')) return;
    $('#mform').classList.add('busy'); toast('Importing… this can take a minute.');
    try {
      const r = await api('importData', PIN, data);
      closeModal(); await refresh(false); render();
      toast(`Imported ${r.members} members, ${r.visitors} visitors and ${r.sessions} sessions.`);
    } catch (e) { fail(e); $('#mform').classList.remove('busy'); }
  });
}

/* ---------- Exports & print ---------- */
function exportMembers() {
  const c = club(), C = counts();
  const rows = [['Bible Club', 'Full Name', 'Sex', 'Date of Birth', 'Age', 'Contact Number', 'Email Address', 'Date of Baptism', 'Congregation', 'Times Attended', 'Last Attended']];
  clubMembers(c.id).forEach(m => rows.push([c.name, m.fullName, m.sex, m.dob, age(m.dob), m.contact, m.email, m.baptism, m.congregation, C.m[m.id] || 0, C.last[m.id] || '']));
  download(slug(c.name) + '-members-' + localToday() + '.csv', csv(rows));
}
function exportVisitors() {
  const c = club(), C = counts();
  const list = UI.allVisitors ? [...D.visitors].sort(byName) : clubVisitors(c.id);
  const rows = [['Name', 'Age Bracket', 'Contact', 'Email Address', 'Company Name', 'Invited By', 'Accepted Christ', 'Date of Salvation', 'First Visited', 'Visits to ' + c.name, 'Total Visits', 'Last Visit']];
  list.forEach(v => rows.push([v.name, v.ageBracket, v.contact, v.email, v.company, v.invitedBy, v.saved, v.salvationDate, v.clubName || getClub(v.clubId)?.name || '', C.vClub[v.id] || 0, C.v[v.id] || 0, C.last[v.id] || '']));
  download(slug(c.name) + '-visitors-' + localToday() + '.csv', csv(rows));
}
function exportMatrix() {
  const c = club(), ses = clubSessions(c.id).reverse();
  if (!ses.length) return toast('There are no sessions to export yet.');
  const rows = [['Type', 'Name', ...ses.map(s => s.date + (s.topic ? ' (' + s.topic + ')' : '')), 'Total']];
  clubMembers(c.id).forEach(m => { const marks = ses.map(s => s.members.includes(m.id) ? 'P' : ''); rows.push(['Member', m.fullName, ...marks, marks.filter(Boolean).length]); });
  clubVisitors(c.id).forEach(v => { const marks = ses.map(s => s.visitors.includes(v.id) ? 'P' : ''); if (marks.some(Boolean)) rows.push(['Visitor', v.name, ...marks, marks.filter(Boolean).length]); });
  rows.push(['', 'Total present', ...ses.map(s => s.members.length + s.visitors.length), '']);
  download(slug(c.name) + '-attendance-' + localToday() + '.csv', csv(rows));
}
function printSession() {
  const c = club(), s = localSession(false), members = clubMembers(c.id), present = new Set(s ? s.members : []);
  const vis = (s ? s.visitors : []).map(getVisitor).filter(Boolean);
  const logo = (c.logoId && IMG[c.logoId]) || logoSrc();
  $('#print-area').innerHTML = `<div class="ph">${logo ? `<img src="${logo}" alt="">` : ''}<div><h1>${esc(c.name)} attendance</h1>
    <div>${esc(fmtDate(UI.date, true))}${s && s.topic ? ', ' + esc(s.topic) : ''}</div>
    <div>${present.size} member${present.size === 1 ? '' : 's'} and ${vis.length} visitor${vis.length === 1 ? '' : 's'} present, ${present.size + vis.length} in total</div></div></div>
    <h2>Members</h2><table><thead><tr><th style="width:40px">#</th><th>Full name</th><th>Congregation</th><th style="width:90px">Present</th></tr></thead><tbody>
    ${members.map((m, i) => `<tr><td>${i + 1}</td><td>${esc(m.fullName)}</td><td>${esc(m.congregation)}</td><td>${present.has(m.id) ? '✓' : ''}</td></tr>`).join('') || '<tr><td colspan="4">No members registered.</td></tr>'}</tbody></table>
    <h2>Visitors</h2><table><thead><tr><th style="width:40px">#</th><th>Name</th><th>Age bracket</th><th>Contact</th><th>Company</th><th>Invited by</th></tr></thead><tbody>
    ${vis.map((v, i) => `<tr><td>${i + 1}</td><td>${esc(v.name)}</td><td>${esc(v.ageBracket)}</td><td>${esc(fmtContact(v.contact))}</td><td>${esc(v.company)}</td><td>${esc(v.invitedBy)}</td></tr>`).join('') || '<tr><td colspan="6">No visitors.</td></tr>'}</tbody></table>`;
  window.print();
}

/* ================= Events ================= */
document.addEventListener('click', async e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  if (el.closest('.sheet')) closeModal();
  const id = el.dataset.id;
  switch (el.dataset.act) {
    case 'home': closeModal(); UI.view = 'clubs'; render(); scrollTo(0, 0); break;
    case 'open-club': if (D && getClub(id)) openClub(id); else pinModal(id); break;
    case 'signin': pinModal(null); break;
    case 'tab': UI.tab = el.dataset.tab; render(); break;
    case 'club-photo': pickFile('#filepick', async f => {
      try {
        const data = await compressImage(f, 1100, .8); toast('Uploading photo…');
        const fid = await api('uploadImage', PIN, 'club', id, data); IMG[fid] = data; getClub(id).photoId = fid; render(); toast('Cover photo updated');
      } catch (err) { fail(err); }
    }); break;
    case 'club-logo': pickFile('#filepick', async f => {
      try {
        const data = await compressImage(f, 320, 1, true); toast('Uploading logo…');
        const fid = await api('uploadImage', PIN, 'clublogo', id, data); IMG[fid] = data; getClub(id).logoId = fid; render(); toast('Club logo updated');
      } catch (err) { fail(err); }
    }); break;
    case 'edit-club': clubModal(getClub(id)); break;
    case 'add-club': clubModal(null); break;
    case 'toggle-member': toggle('Member', id); break;
    case 'toggle-visitor': toggle('Visitor', id); break;
    case 'add-member': memberModal(null); break;
    case 'edit-member': memberModal(getMember(id)); break;
    case 'view-member': personModal('m', id); break;
    case 'add-visitor': visitorModal(null, el.dataset.mark === '1'); break;
    case 'edit-visitor': visitorModal(getVisitor(id)); break;
    case 'view-visitor': personModal('v', id); break;
    case 'convert-visitor': { const v = getVisitor(id); memberModal(null, { fullName: v.name, contact: v.contact, email: v.email, clubId: UI.clubId }, v); break; }
    case 'add-schedule': scheduleModal(null); break;
    case 'edit-schedule': scheduleModal(D.schedule.find(x => x.id === id)); break;
    case 'open-session': UI.date = el.dataset.date; UI.tab = 'attendance'; render(); break;
    case 'delete-session': {
      const s = D.sessions.find(x => x.id === id);
      if (s && confirm('Delete the attendance for ' + fmtDate(s.date, true) + '?' + (s.photoCount ? ' Its photos stay in the Google Drive folder.' : ''))) {
        try { await api('deleteSession', PIN, id); D.sessions = D.sessions.filter(x => x !== s); render(); toast('Session deleted'); } catch (err) { fail(err); }
      }
      break;
    }
    case 'export-members': exportMembers(); break;
    case 'export-visitors': exportVisitors(); break;
    case 'export-matrix': exportMatrix(); break;
    case 'print-session': printSession(); break;
    case 'photos': photosModal(el.dataset.date || UI.date); break;
    case 'qr': qrModal(getClub(id)); break;
    case 'qr-menu': qrMenu(getClub(id)); break;
    case 'more-menu': moreMenu(getClub(id)); break;
    case 'qr-register': qrModal(getClub(id), true); break;
    case 'approve-member': {
      el.disabled = true;
      try {
        const r = await api('approveMember', PIN, id);
        const m = getMember(id); Object.assign(m, r.member);
        if (r.mergedVisitorId) {
          D.sessions.forEach(s => { if (s.visitors.includes(r.mergedVisitorId)) { s.visitors = s.visitors.filter(x => x !== r.mergedVisitorId); if (!s.members.includes(id)) s.members.push(id); } });
          D.visitors = D.visitors.filter(v => v.id !== r.mergedVisitorId);
        }
        render(); toast(m.fullName + ' approved' + (r.mergedVisitorId ? '. Their visits now count as member attendance.' : ''));
      } catch (err) { el.disabled = false; fail(err); }
      break;
    }
    case 'reject-member': {
      const m = getMember(id);
      if (!m || !confirm('Decline the registration for ' + m.fullName + '? It will be removed.')) break;
      try { await api('rejectMember', PIN, id); D.members = D.members.filter(x => x !== m); D.sessions.forEach(s => s.members = s.members.filter(x => x !== id)); render(); toast('Registration declined'); }
      catch (err) { fail(err); }
      break;
    }
    case 'settings': settingsModal(); break;
    case 'refresh': refresh(true); break;
    case 'signout': signOut(); break;
    case 'close-modal': closeModal(); break;
  }
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'mq') { UI.mq = t.value; refreshAttendance(); }
  else if (t.id === 'vq') { UI.vq = t.value; refreshAttendance(); }
  else if (t.id === 'regq') { UI.regQ = t.value; refreshMembers(); }
  else if (t.id === 'visq') { UI.visQ = t.value; refreshVisitors(); }
});
document.addEventListener('change', async e => {
  const t = e.target;
  if (t.id === 'att-date' && t.value) { UI.date = t.value; render(); }
  else if (t.id === 'att-topic') {
    const topic = t.value.trim(), date = UI.date, clubId = UI.clubId;
    const s = localSession(!!topic); if (s) { s.topic = topic; pruneLocal(s); }
    pending++;
    try { const r = await api('setTopic', PIN, clubId, date, topic); const ls = D.sessions.find(x => x.clubId === clubId && x.date === date); if (ls && r.sessionId) ls.id = r.sessionId; }
    catch (err) { fail(err); } finally { pending--; }
  }
  else if (t.id === 'allv') { UI.allVisitors = t.checked; refreshVisitors(); }
});

(async () => {
  const saved = store.get('bc-pin');
  const slow = setTimeout(() => {
    if (PUB || D) return;
    $('#app').innerHTML = `<div class="loading-screen"><div><div class="spinner"></div>
      <p style="margin:0 0 6px;font-weight:600;color:var(--ink)">This is taking longer than usual.</p>
      <p style="margin:0">The Bible Clubs are still loading. Check your connection, or reload the page.</p></div></div>`;
  }, 20000);
  try {
    await Promise.all([
      loadPublic(),
      saved ? api('getAppData', saved).then(r => { PIN = saved; absorb(r); }).catch(() => store.set('bc-pin', null)) : Promise.resolve()
    ]);
    render();
  } catch (e) {
    $('#app').innerHTML = `<div class="loading-screen"><div><p style="font-weight:600;color:var(--ink)">The Bible Clubs could not be loaded.</p><p>${esc(e.message)}</p></div></div>`;
  } finally { clearTimeout(slow); }
})();
